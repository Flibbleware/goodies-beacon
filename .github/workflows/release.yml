name: Release

# On a published GitHub Release tagged vX.Y.Z: build and push the images for both architectures,
# write the notes from the commits since the last tag, then deploy through the shared job.

on:
  release:
    types: [published]

jobs:
  images:
    name: Publish images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive full image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Derive slim image tags
        id: meta-slim
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/slim
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push the full image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GOODIES_BEACON_VERSION=${{ github.event.release.tag_name }}
            GOODIES_BEACON_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push the slim image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime-slim
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-slim.outputs.tags }}
          labels: ${{ steps.meta-slim.outputs.labels }}
          build-args: |
            GOODIES_BEACON_VERSION=${{ github.event.release.tag_name }}
            GOODIES_BEACON_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  notes:
    name: Release notes
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The whole history, because the notes are the commits since the previous tag.
          fetch-depth: 0

      - name: Write the notes from the conventional commits
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          ./scripts/release-notes.sh "$TAG" > notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"
          gh release edit "$TAG" --notes-file notes.md

  deploy:
    name: Deploy
    # Only once the images the droplet is about to pull actually exist.
    needs: images
    uses: ./.github/workflows/deploy.yml
    with:
      tag: ${{ github.event.release.tag_name }}
    secrets: inherit
