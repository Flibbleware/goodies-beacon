name: CI

on:
  pull_request:
  push:
    # The integration branch publishes too, so a manual deploy always has something to pull.
    branches: [main, 'development/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up workspace
        uses: ./.github/actions/setup

      - name: Biome
        run: pnpm lint

      # Biome does not read shell, and these run as root on someone's server.
      - name: Shellcheck
        run: shellcheck scripts/*.sh

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up workspace
        uses: ./.github/actions/setup

      - name: Typecheck
        run: pnpm typecheck

  tests:
    name: Tests
    runs-on: ubuntu-latest

    # The migration and pg-boss tests need a real Postgres: advisory locks, queue
    # tables and a graceful shutdown mid-job are not things a fake can demonstrate.
    # Without TEST_DATABASE_URL they skip themselves instead of failing.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: goodies_beacon
          POSTGRES_PASSWORD: goodies_beacon
          POSTGRES_DB: goodies_beacon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U goodies_beacon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # Mailpit is what development sends to, so the SMTP transport and the test-send
      # endpoint are exercised against a real server rather than a stub. It starts in well
      # under a second and the build step runs before any test, so it needs no health gate.
      mailpit:
        image: axllent/mailpit:v1.31.1
        ports:
          - 1025:1025
          - 8025:8025

    env:
      TEST_DATABASE_URL: postgres://goodies_beacon:goodies_beacon@localhost:5432/goodies_beacon_test
      TEST_SMTP_URL: smtp://localhost:1025
      TEST_MAILPIT_URL: http://localhost:8025

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up workspace
        uses: ./.github/actions/setup

      # Tests import workspace packages through their published `exports`, which
      # point at dist, so they must be compiled before vitest runs. apps/worker is
      # a library too: apps/api imports its queue registrations.
      - name: Build workspace packages
        run: pnpm -r --filter './packages/**' --filter @goodies-beacon/worker build

      - name: Vitest
        run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up workspace
        uses: ./.github/actions/setup

      - name: Build
        run: pnpm build

      # The route table is the source of truth for docs/API.md, so a new endpoint cannot
      # merge undocumented.
      - name: API docs are current
        run: pnpm docs:api --check

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: goodies_beacon
          POSTGRES_PASSWORD: goodies_beacon
          POSTGRES_DB: goodies_beacon_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U goodies_beacon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # Mailpit is what development sends to, so the SMTP transport and the test-send
      # endpoint are exercised against a real server rather than a stub. It starts in well
      # under a second and the build step runs before any test, so it needs no health gate.
      mailpit:
        image: axllent/mailpit:v1.31.1
        ports:
          - 1025:1025
          - 8025:8025

    env:
      E2E_DATABASE_URL: postgres://goodies_beacon:goodies_beacon@localhost:5432/goodies_beacon_e2e
      E2E_MAILPIT_URL: http://localhost:8025

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up workspace
        uses: ./.github/actions/setup

      # Playwright drives the built API serving the built web app, exactly as the container
      # does, so both have to exist before it runs.
      - name: Build
        run: pnpm build

      - name: Install Chromium
        run: pnpm --filter @goodies-beacon/web exec playwright install --with-deps chromium

      - name: Playwright
        run: pnpm e2e

      - name: Upload the report when it fails
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  docker:
    name: Docker image
    needs: [lint, typecheck, tests, build, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: goodies_beacon
          POSTGRES_PASSWORD: goodies_beacon
          POSTGRES_DB: goodies_beacon_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U goodies_beacon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=dev,enable=${{ startsWith(github.ref, 'refs/heads/development/') }}
            type=sha,prefix=sha-,format=short

      - name: Derive slim image tags
        id: meta-slim
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/slim
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=dev,enable=${{ startsWith(github.ref, 'refs/heads/development/') }}
            type=sha,prefix=sha-,format=short

      # Loaded as well as pushed, so the size gate and the start-up check have something local
      # to look at on a pull request, where nothing is published.
      - name: Build the full image (push on main)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GOODIES_BEACON_VERSION=${{ steps.meta.outputs.version }}
            GOODIES_BEACON_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the slim image (push on main)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime-slim
          platforms: linux/amd64
          load: true
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta-slim.outputs.tags }}
          labels: ${{ steps.meta-slim.outputs.labels }}
          build-args: |
            GOODIES_BEACON_VERSION=${{ steps.meta.outputs.version }}
            GOODIES_BEACON_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The droplet has 2 GB and pulls over a domestic connection, so size is a budget rather
      # than a curiosity. Both numbers go in the job summary either way.
      - name: Check image sizes
        env:
          FULL_TAG: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          SLIM_TAG: ${{ fromJSON(steps.meta-slim.outputs.json).tags[0] }}
        run: |
          full=$(docker image inspect "$FULL_TAG" --format '{{.Size}}')
          slim=$(docker image inspect "$SLIM_TAG" --format '{{.Size}}')
          full_mb=$((full / 1024 / 1024))
          slim_mb=$((slim / 1024 / 1024))

          {
            echo "| Image | Size | Budget |"
            echo "|---|--:|--:|"
            echo "| full | ${full_mb} MB | 1000 MB |"
            echo "| slim | ${slim_mb} MB | 400 MB |"
          } >> "$GITHUB_STEP_SUMMARY"

          failed=0
          [ "$full_mb" -le 1000 ] || { echo "::error::full image is ${full_mb} MB, over the 1000 MB budget"; failed=1; }
          [ "$slim_mb" -le 400 ] || { echo "::error::slim image is ${slim_mb} MB, over the 400 MB budget"; failed=1; }
          exit $failed

      # Nothing above would notice a workspace package whose build output was never copied in:
      # the image builds perfectly and then dies at import on first start.
      - name: The image starts and answers /healthz
        env:
          FULL_TAG: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
        run: |
          docker run -d --name beacon-smoke --network host \
            -e ROLE=api -e PORT=3000 \
            -e GOODIES_BEACON_HOST=localhost:3000 \
            -e GOODIES_BEACON_SECRET_KEY=IqQ8Xn1rWQhTsm9gOZ4vKdLpEbYxAcRuNjFkHt2SwVo= \
            -e DATABASE_URL=postgres://goodies_beacon:goodies_beacon@localhost:5432/goodies_beacon_smoke \
            "$FULL_TAG"

          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:3000/healthz; then
              echo
              docker rm -f beacon-smoke >/dev/null
              exit 0
            fi
            sleep 2
          done

          echo '::error::the image did not answer /healthz within 60 seconds'
          docker logs beacon-smoke
          exit 1
