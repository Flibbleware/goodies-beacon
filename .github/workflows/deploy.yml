name: Deploy

# The one path to the droplet. `release.yml` calls it after publishing a release, and it can be
# run by hand from the Actions tab to put any built tag there — so `deploy.sh` has a single
# caller and there is nothing to keep in step.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to deploy (dev is the integration branch build)'
        required: true
        default: dev
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.tag }}
    runs-on: ubuntu-latest
    environment: production

    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'deploy' }}
      DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
      DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}

    steps:
      # A fork has none of these secrets, and should say so plainly rather than failing.
      - name: Are the deploy secrets configured?
        id: guard
        run: |
          if [ -z "${DEPLOY_HOST:-}" ] || [ -z "${DEPLOY_KEY:-}" ]; then
            echo '::notice title=Nothing was deployed::DEPLOY_HOST and DEPLOY_KEY are not set, so this repository has no droplet to deploy to. Expected on a fork.'
            echo 'configured=false' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy over SSH
        if: steps.guard.outputs.configured == 'true'
        env:
          TAG: ${{ inputs.tag }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          if [ -n "${DEPLOY_HOST_KEY:-}" ]; then
            printf '%s\n' "$DEPLOY_HOST_KEY" > ~/.ssh/known_hosts
          else
            # Without a pinned key this is trust-on-first-use every run, which verifies nothing.
            echo '::warning title=Unverified host::DEPLOY_HOST_KEY is not set, so the droplet is trusted on sight. Add it (ssh-keyscan on the droplet) to rule out a man in the middle.'
            ssh-keyscan -H "$DEPLOY_HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

          # The tag goes as an argument, never interpolated into this script: a workflow_dispatch
          # input is whatever the person typed. The key's forced command on the droplet ignores it
          # as a command and hands it to deploy.sh, which checks it looks like a tag.
          ssh -i ~/.ssh/id_deploy \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" "$TAG"

      - name: Forget the key
        if: always()
        run: rm -rf ~/.ssh
